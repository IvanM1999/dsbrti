<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions - IvanM1999</title>
    
    <script src="https://unpkg.com/github-calendar@latest/dist/github-calendar.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/github-calendar@latest/dist/github-calendar-responsive.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #f3f4f6;
        }

        /* Container ajustado perfeitamente aos 220px */
        .dashboard-container {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            height: 100vh;
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        /* Card de Perfil */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            min-width: 110px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-container {
            width: 42px;
            height: 42px;
            margin-bottom: 6px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #39d353;
            box-shadow: 0 0 8px rgba(57, 211, 83, 0.2);
        }

        .username {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .role-text {
            font-size: 10px;
            color: #8b949e;
            margin-top: 2px;
        }

        /* Área do Gráfico */
        .grid-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            color: #8b949e;
        }

        .legend-box {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .calendar-wrapper {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }

        .calendar { 
            border: none !important; 
            background: transparent !important; 
            width: 100%;
        }

        .js-calendar-graph { 
            margin: 0 !important; 
            padding: 0 !important; 
        }

        /* Otimização visual para o SVG de 8 semanas */
        svg.js-calendar-graph-svg { 
            height: 100px !important;
            width: auto !important;
            max-width: 100% !important;
            background: transparent !important;
        }

        /* Oculta textos padrões do GitHub */
        .calendar text, 
        .calendar .contrib-column, 
        .calendar .contrib-number,
        .calendar .text-muted, 
        .calendar h2, 
        .calendar .float-left,
        .ContributionCalendar-label, 
        .sr-only, 
        .month {
            display: none !important;
        }

        /* Formato dos quadradinhos */
        .grid-content rect.ContributionCalendar-day {
            rx: 3px !important;
            ry: 3px !important;
            width: 12px !important;
            height: 12px !important;
        }

        /* Níveis de cor vibrantes (Visível até 1 commit) */
        .grid-content [data-level="0"] { fill: #161b22 !important; }
        .grid-content [data-level="1"] { fill: #0e4429 !important; } 
        .grid-content [data-level="2"] { fill: #006d32 !important; }
        .grid-content [data-level="3"] { fill: #26a641 !important; }
        .grid-content [data-level="4"] { fill: #39d353 !important; }

        @media (max-width: 380px) {
            .dashboard-container {
                padding: 8px;
                gap: 8px;
            }
            .profile-card {
                min-width: 85px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Perfil Esquerda -->
        <div class="profile-card">
            <div class="avatar-container">
                <img src="https://github.com/IvanM1999.png" alt="IvanM1999" class="avatar-img">
            </div>
            <div class="username">IvanM1999</div>
            <div class="role-text">GitHub User</div>
        </div>        

        <!-- Gráfico Direita (8 semanas) -->
        <div class="grid-content">
            <div class="header-row">
                <div class="section-title">Últimas 8 Semanas</div>
                <div class="legend">
                    <span>-</span>
                    <div class="legend-box" style="background: #161b22;"></div>
                    <div class="legend-box" style="background: #0e4429;"></div>
                    <div class="legend-box" style="background: #26a641;"></div>
                    <div class="legend-box" style="background: #39d353;"></div>
                    <span>+</span>
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="calendar">
                    <span style="color: #8b949e; font-size: 11px;">Carregando...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        GitHubCalendar(".calendar", "IvanM1999", { 
            responsive: true,
            summaryHtml: "" 
        }).then(() => {
            // Script para filtrar e manter apenas as últimas 8 semanas
            const svg = document.querySelector(".js-calendar-graph-svg");
            if (svg) {
                const weeks = svg.querySelectorAll("g > g");
                const totalWeeks = weeks.length;
                const weeksToShow = 8;

                // Remove todas as semanas anteriores às últimas 8
                weeks.forEach((week, index) => {
                    if (index < totalWeeks - weeksToShow) {
                        week.remove();
                    }
                });

                // Reposiciona o SVG para alinhar à esquerda após remover as colunas antigas
                const remainingWeeks = svg.querySelectorAll("g > g");
                remainingWeeks.forEach((week, i) => {
                    week.setAttribute("transform", `translate(${i * 16}, 0)`);
                });

                // Ajusta a caixa de visualização (viewBox) do SVG para o tamanho das 8 semanas
                const newWidth = weeksToShow * 16;
                svg.setAttribute("viewBox", `0 0 ${newWidth} 110`);
                svg.setAttribute("width", newWidth);
            }
        });
    </script>
</body>
</html>
