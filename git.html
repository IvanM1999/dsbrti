<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions - IvanM1999</title>
    
    <!-- Biblioteca oficial do calendário do GitHub -->
    <script src="https://unpkg.com/github-calendar@latest/dist/github-calendar.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/github-calendar@latest/dist/github-calendar-responsive.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #f3f4f6;
            overflow: hidden; /* Evita barras de rolagem desnecessárias na iframe */
        }

        /* Container Principal com Estilo Moderno / Glassmorphism */
        .dashboard-container {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            width: 100%;
            max-width: 100%;
        }

        /* Lado Esquerdo: Perfil do Usuário */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            text-align: center;
            min-width: 110px;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .profile-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .avatar-container {
            width: 40px;
            height: 40px;
            margin: 0 auto 6px auto;
            position: relative;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #39d353;
            box-shadow: 0 0 10px rgba(57, 211, 83, 0.3);
        }

        .username {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .role-text {
            font-size: 10px;
            color: #8b949e;
            margin-top: 1px;
        }

        /* Lado Direito: Gráfico de Atividade */
        .grid-content {
            flex-grow: 1;
            min-width: 0; /* Essencial para conter o SVG em flexbox */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            color: #8b949e;
        }

        .legend-box {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        /* Otimização de Responsividade do SVG */
        .calendar-wrapper {
            width: 100%;
            overflow: hidden;
        }

        .calendar { 
            border: none !important; 
            background: transparent !important; 
        }

        .js-calendar-graph { 
            margin: 0 !important; 
            padding: 0 !important; 
        }

        /* Torna o elemento SVG dinâmico para caber no container */
        svg.js-calendar-graph-svg { 
            width: 100% !important;
            height: auto !important;
            background: transparent !important;
        }

        /* Oculta textos indesejados fornecidos pelo script padrão */
        .calendar text, 
        .calendar .contrib-column, 
        .calendar .contrib-number,
        .calendar .text-muted, 
        .calendar h2, 
        .calendar .float-left,
        .ContributionCalendar-label, 
        .sr-only, 
        .month {
            display: none !important;
        }

        /* Arredondamento e formato dos quadradinhos */
        .grid-content rect.ContributionCalendar-day {
            rx: 2px !important;
            ry: 2px !important;
        }

        /* Paleta de Cores de Alto Contraste (Destaque para Pequenas Alterações) */
        .grid-content [data-level="0"] { fill: #161b22 !important; outline: 1px solid rgba(255, 255, 255, 0.03); }
        .grid-content [data-level="1"] { fill: #0e4429 !important; } /* 1-3 commits: verde bem perceptível */
        .grid-content [data-level="2"] { fill: #006d32 !important; }
        .grid-content [data-level="3"] { fill: #26a641 !important; }
        .grid-content [data-level="4"] { fill: #39d353 !important; } /* Nível máximo: Verde brilhante */

        /* Ajuste para telas pequenas/mobile dentro de iframes */
        @media (max-width: 480px) {
            .dashboard-container {
                flex-direction: column;
                padding: 10px;
                gap: 8px;
            }

            .profile-card {
                display: flex;
                align-items: center;
                gap: 10px;
                text-align: left;
                width: 100%;
                padding: 6px 10px;
            }

            .avatar-container {
                margin: 0;
                width: 30px;
                height: 30px;
            }

            .header-row {
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Perfil -->
        <div class="profile-card">
            <div class="avatar-container">
                <img src="https://github.com/IvanM1999.png" alt="IvanM1999" class="avatar-img">
            </div>
            <div>
                <div class="username">IvanM1999</div>
                <div class="role-text">GitHub Developer</div>
            </div>
        </div>        

        <!-- Gráfico -->
        <div class="grid-content">
            <div class="header-row">
                <div class="section-title">Contribuições do Ano</div>
                <div class="legend">
                    <span>Menos</span>
                    <div class="legend-box" style="background: #161b22;"></div>
                    <div class="legend-box" style="background: #0e4429;"></div>
                    <div class="legend-box" style="background: #26a641;"></div>
                    <div class="legend-box" style="background: #39d353;"></div>
                    <span>Mais</span>
                </div>
            </div>

            <div class="calendar-wrapper">
                <div class="calendar">
                    <span style="color: #8b949e; font-size: 11px;">Carregando histórico...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        GitHubCalendar(".calendar", "IvanM1999", { 
            responsive: true,
            summaryHtml: "" 
        });
    </script>
</body>
</html>
