<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions - IvanM1999</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #f3f4f6;
        }

        .dashboard-container {
            background: linear-gradient(145deg, rgba(42, 22, 33, 0.9), rgba(24, 14, 21, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .avatar-img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #00ff87;
            flex-shrink: 0;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .username {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .role-text {
            font-size: 8px;
            color: #9ca3af;
            white-space: nowrap;
        }

        .metric-box {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .commit-count {
            font-size: 22px;
            font-weight: 800;
            color: #f95721;
            line-height: 1;
        }

        .metric-label {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .section-title {
            font-size: 7px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.1;
            white-space: nowrap;
        }

        .chart-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 2px;
        }

        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(8, 12px);
            grid-template-rows: repeat(7, 12px);
            grid-auto-flow: column;
            gap: 3.5px;
        }

        .day-cell {
            width: 12px;
            height: 12px;
            border-radius: 2.5px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .day-cell:hover {
            transform: scale(1.35);
            z-index: 10;
        }

        /* ================= PALETA DE 5 NÍVEIS (VISIBILIDADE TOTAL) ================= */
        
        /* Level 0: Nenhuma atividade -> 100% Transparente */
        .level-0 { 
            background-color: transparent !important; 
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        /* Level 1: 1 a 3 contribuições -> Verde Sutil */
        .level-1 { 
            background-color: #00aa55 !important; 
            box-shadow: 0 0 3px rgba(0, 170, 85, 0.4);
        }

        /* Level 2: 4 a 8 contribuições -> Verde Médio */
        .level-2 { 
            background-color: #00e676 !important; 
            box-shadow: 0 0 5px rgba(0, 230, 118, 0.5);
        }

        /* Level 3: 9 a 15 contribuições -> Verde Menta/Neon */
        .level-3 { 
            background-color: #00ff87 !important; 
            box-shadow: 0 0 8px rgba(0, 255, 135, 0.7);
        }

        /* Level 4: 16+ contribuições (Dias intensos de 20+) -> Verde-Lima Fluorescente com Glow */
        .level-4 { 
            background-color: #a3ff12 !important; 
            box-shadow: 0 0 12px rgba(163, 255, 18, 0.9);
        }

        #loading-text {
            font-size: 10px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="card-header">
            <div class="user-info">
                <img src="https://github.com/IvanM1999.png" alt="IvanM1999" class="avatar-img">
                <div class="user-details">
                    <span class="username">IvanM1999</span>
                    <span class="role-text">GitHub User</span>
                </div>
            </div>

            <div class="metric-box">
                <span id="commit-total" class="commit-count">0</span>
                <div class="metric-label">
                    <span class="section-title">COMMITS</span>
                    <span class="section-title" style="opacity: 0.6; font-size: 6.5px;">8 SEMANAS</span>
                </div>
            </div>
        </div>        

        <div class="chart-section">
            <div id="heatmap" class="heatmap-grid">
                <span id="loading-text">Carregando...</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchGitHubContributions(username) {
            const heatmapContainer = document.getElementById('heatmap');
            const commitTotalCounter = document.getElementById('commit-total');
            
            try {
                const response = await fetch(`https://github-contributions-api.jogruber.de/v4/${username}?y=last`);
                const data = await response.json();
                
                if (!data.contributions) throw new Error("Erro nos dados");

                const totalDaysNeeded = 8 * 7;
                const recentContributions = data.contributions.slice(-totalDaysNeeded);

                const totalCommits = recentContributions.reduce((sum, day) => sum + day.count, 0);
                commitTotalCounter.innerText = totalCommits;

                heatmapContainer.innerHTML = '';

                recentContributions.forEach(day => {
                    const cell = document.createElement('div');
                    
                    // Cálculo de Nível Personalizado para garantir que dias de 20+ destaquem em nível 4
                    let calculatedLevel = day.level;
                    if (day.count === 0) calculatedLevel = 0;
                    else if (day.count >= 1 && day.count <= 3) calculatedLevel = 1;
                    else if (day.count >= 4 && day.count <= 8) calculatedLevel = 2;
                    else if (day.count >= 9 && day.count <= 15) calculatedLevel = 3;
                    else if (day.count >= 16) calculatedLevel = 4; // 16 a 20+ inserções em destaque máximo

                    cell.className = `day-cell level-${calculatedLevel}`;
                    cell.title = `${day.date}: ${day.count} contribuição(ões)`;
                    heatmapContainer.appendChild(cell);
                });

            } catch (error) {
                console.error(error);
                heatmapContainer.innerHTML = '<span id="loading-text" style="color: #f87171;">Erro</span>';
            }
        }

        fetchGitHubContributions('IvanM1999');
    </script>
</body>
</html>
