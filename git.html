<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Contributions - IvanM1999</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #f3f4f6;
        }

        /* Container que simula EXATAMENTE o estilo dos cards superiores */
        .dashboard-container {
            background: linear-gradient(145deg, rgba(42, 22, 33, 0.85), rgba(28, 16, 25, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px 16px;
            height: 100vh;
            display: flex;
            flex-direction: row;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        /* Card do Perfil estilo Pill */
        .profile-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px 8px;
            text-align: center;
            width: 90px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-container {
            width: 38px;
            height: 38px;
            margin-bottom: 6px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2ea043;
        }

        .username {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            white-space: nowrap;
        }

        .role-text {
            font-size: 9px;
            color: #9ca3af;
            margin-top: 2px;
        }

        /* Lado do Gráfico e Métrica */
        .grid-content {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; /* Alinha o gráfico à direita para dar respiro ao perfil */
        }

        .metric-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 8px;
            width: 100%;
            justify-content: flex-end;
        }

        /* Destaque em Laranja no tom dos números do seu portfólio (#f95721 / #f97316) */
        .commit-count {
            font-size: 20px;
            font-weight: 800;
            color: #f95721;
            line-height: 1;
        }

        .section-title {
            font-size: 9px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* Grid de 8 Colunas (Semanas) x 7 Linhas (Dias) */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(8, 11px);
            grid-template-rows: repeat(7, 11px);
            grid-auto-flow: column;
            gap: 3px;
        }

        /* Formato dos Blocos */
        .day-cell {
            width: 11px;
            height: 11px;
            border-radius: 2.5px;
            transition: transform 0.15s ease;
        }

        .day-cell:hover {
            transform: scale(1.25);
        }

        /* Níveis de cor otimizados para o tema escuro/vinho */
        .level-0 { background-color: rgba(255, 255, 255, 0.06) !important; }
        .level-1 { background-color: #0e4429 !important; }
        .level-2 { background-color: #006d32 !important; }
        .level-3 { background-color: #26a641 !important; }
        .level-4 { background-color: #39d353 !important; }

        #loading-text {
            font-size: 10px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Perfil -->
        <div class="profile-card">
            <div class="avatar-container">
                <img src="https://github.com/IvanM1999.png" alt="IvanM1999" class="avatar-img">
            </div>
            <div class="username">IvanM1999</div>
            <div class="role-text">GitHub User</div>
        </div>        

        <!-- Gráfico e Métricas -->
        <div class="grid-content">
            <div class="metric-header">
                <span id="commit-total" class="commit-count">0</span>
                <span class="section-title">Commits (8 Semanas)</span>
            </div>
            <div id="heatmap" class="heatmap-grid">
                <span id="loading-text">Carregando...</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchGitHubContributions(username) {
            const heatmapContainer = document.getElementById('heatmap');
            const commitTotalCounter = document.getElementById('commit-total');
            
            try {
                const response = await fetch(`https://github-contributions-api.jogruber.de/v4/${username}?y=last`);
                const data = await response.json();
                
                if (!data.contributions) throw new Error("Erro nos dados");

                // Filtra os últimos 56 dias
                const totalDaysNeeded = 8 * 7;
                const recentContributions = data.contributions.slice(-totalDaysNeeded);

                // Calcula o total de commits no período
                const totalCommits = recentContributions.reduce((sum, day) => sum + day.count, 0);
                commitTotalCounter.innerText = totalCommits;

                heatmapContainer.innerHTML = '';

                recentContributions.forEach(day => {
                    const cell = document.createElement('div');
                    cell.className = `day-cell level-${day.level}`;
                    cell.title = `${day.date}: ${day.count} contribuição(ões)`;
                    heatmapContainer.appendChild(cell);
                });

            } catch (error) {
                console.error(error);
                heatmapContainer.innerHTML = '<span id="loading-text" style="color: #f87171;">Erro</span>';
            }
        }

        fetchGitHubContributions('IvanM1999');
    </script>
</body>
</html>
